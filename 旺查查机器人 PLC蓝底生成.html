//加载动画
const style=document.createElement('style');style.textContent=` .js-loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none !important;cursor:default !important;background-color:rgba(0,0,0,0.1);display:flex;justify-content:center;align-items:center;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.3s ease-in-out;}.js-loading-overlay.active{opacity:1;}.js-loading-spinner{color:#ccc;opacity:1;font-size:13px;font-weight:900;backdrop-filter:blur(10px);background-color:rgba(32,32,32,0.5);padding:10px 20px;border-radius:100px;display:flex;align-items:center;}.js-loading-spinner::before{content:'';border:5px solid rgba(255,255,255,0.3);border-radius:50%;border-top:5px solid white;width:10px;height:10px;animation:js-loading-spin 1s linear infinite;margin-right:8px;}@keyframes js-loading-spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}`;document.head.appendChild(style);const loadingOverlay=document.createElement('div');loadingOverlay.className='js-loading-overlay';loadingOverlay.innerHTML='<div class="js-loading-spinner">正在加载模板资源…</div>';document.body.appendChild(loadingOverlay);let loadingTimeout;let transitionTimeout;function showLoading(){if (transitionTimeout){clearTimeout(transitionTimeout);transitionTimeout=null;}loadingOverlay.classList.add('active');if (loadingTimeout){clearTimeout(loadingTimeout);}loadingTimeout=setTimeout(()=>{hideLoading();},10000);}function hideLoading(){loadingOverlay.classList.remove('active');transitionTimeout=setTimeout(()=>{if (loadingTimeout){clearTimeout(loadingTimeout);loadingTimeout=null;}},500);}window.addEventListener('load',hideLoading);window.addEventListener('DOMContentLoaded',function(){showLoading();});window.addEventListener('beforeunload',showLoading);document.addEventListener('click',function(e){let target=e.target;while (target && target.tagName !=='A' && target !==document.body){target=target.parentNode;}if (target && target.tagName==='A' && target.href){showLoading();}});document.addEventListener('submit',function(){showLoading();});if (window.fetch){const originalFetch=window.fetch;window.fetch=function(){showLoading();return originalFetch.apply(this,arguments) .then(response=>{hideLoading();return response;}) .catch(error=>{hideLoading();throw error;});};}

document.getElementById('uploadBtn').addEventListener('click', function() {     
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*'; 
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file.type.startsWith('image/')) {
            alert('请选择一个图片文件！');
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.createElement('img');               
            img.src = e.target.result;
            document.getElementById('imageContainer').innerHTML = ''; // 清空旧图片
            document.getElementById('imageContainer').appendChild(img); // 显示新图片
        };
        reader.readAsDataURL(file);
    };
    input.click(); 
});
function showResult() {
    var input = document.getElementById('userInput').value;  
    var result = input;
    document.getElementById('result').innerHTML = result;
    var input = document.getElementById('userInput1').value;  
    var result = input ;
    document.getElementById('result1').innerHTML = result;
    var input = document.getElementById('userInput2').value;  
    var result = input;
    document.getElementById('result2').innerHTML = result;
    var input = document.getElementById('userInput3').value;
    var result = input;
    document.getElementById('result3').innerHTML = result;
    var input = document.getElementById('userInput4').value;
    var result = input;
    document.getElementById('result4').innerHTML = result;
    var input = document.getElementById('userInput5').value;  
    var result = input;
    document.getElementById('result5').innerHTML = result;
}

const defaultValues = {
    'userInput': '事例信息',
    'userInput1': '男',
    'userInput2': '汉族',
    'userInput3': '2008年10月01日',
    'userInput4': '11010520081001123',
    'userInput5': '北京市朝阳区'
};
function initDefaultData() {
    for (let id in defaultValues) {
        document.getElementById(id).value = defaultValues[id];
    }
    const img = document.createElement('img');               
    img.src = 'https://tse3-mm.cn.bing.net/th/id/OIP-C.K2pend6ibmxVXC83Ui_lfAAAAA?w=166&h=166&c=7&pcl=292827&r=0&o=7&dpr=3&pid=1.7&rm=3';
    document.getElementById('imageContainer').innerHTML = '';
    document.getElementById('imageContainer').appendChild(img);
    showResult();
}
function clearPlaceholder(inputEl) {
    if (inputEl.value === defaultValues[inputEl.id]) {
        inputEl.value = '';
        showResult();
    }
}
window.addEventListener('DOMContentLoaded', initDefaultData);
</script>
