();}});document.addEventListener('submit',function(){showLoading();});if (window.fetch){const originalFetch=window.fetch;window.fetch=function(){showLoading();return originalFetch.apply(this,arguments) .then(response=>{hideLoading();return response;}) .catch(error=>{hideLoading();throw error;});};}

window.onload = function() {           
            var today = new Date();          
            var year = today.getFullYear();
            var month = String(today.getMonth() + 1).padStart(2, '0'); // 月份是从0开始的，所以要加1
            var day = String(today.getDate()).padStart(2, '0');      
            var formattedDate ='制证日期:' + year + '年' + month + '月' + day + '日';
            document.getElementById('currentDate').innerText = formattedDate;
        };
document.getElementById('uploadBtn').addEventListener('click', function() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*'; // 只接受图片文件
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file.type.startsWith('image/')) {
            alert('请选择一个图片文件！');
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.createElement('img');           
            img.src = e.target.result;
            document.getElementById('imageContainer').innerHTML = ''; // 清空旧图片
            document.getElementById('imageContainer').appendChild(img); // 显示新图片
        };
        reader.readAsDataURL(file);
    };
    input.click(); 
});
function showResult() {
    var input = document.getElementById('userInput').value;
    var result = "<b>姓名    </b>" + input;
    document.getElementById('result').innerHTML = result;
    var input = document.getElementById('userInput1').value;
    var result = "<b>社会保障号码    </b>" + input ;
    document.getElementById('result1').innerHTML = result;
    var input = document.getElementById('userInput2').value;
    var result = "<b>银行卡号   </b>" + input;
    document.getElementById('result2').innerHTML = result;
}
</script>
