<div class="box">
    <h3>身份证补齐•非库</h3>
      <input maxlength="14" type="tel" id="idPrefix" placeholder="请输入前14位模糊身份证">
     <p style="margin:3px"></p>  
     <select id="gender">
          <option value="male">性别: 男</option>
          <option value="female">性别: 女</option>
    </select>    
      <p style="margin:3px"></p>
    <button onclick="generateIDCards()">开始补齐</button>

    <button onclick="copyToClipboard()">复制结果</button>
      <p><textarea id="result" readonly></textarea></p>
  </div>
    <script>    
      function calculateCheckCode(id) {
            const weights = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
            const checkCodes = ['1', '0', 'X', '9', '8', '7', '6', '5', '4', '3', '2'];
            let sum = 0;
            for (let i = 0; i < 17; i++) {
                sum += parseInt(id[i]) * weights[i];
            }
            return checkCodes[sum % 11];
        }
        function generateIDCards() {
            const idPrefix = document.getElementById('idPrefix').value;
            const gender = document.getElementById('gender').value;
            const resultTextarea = document.getElementById('result');

            if (idPrefix.length !== 14 || !/^\d{14}$/.test(idPrefix)) {
                resultTextarea.value = '请输入正确的前14位身份证号码！';
                return;
            }
            let possibleIDs = [];
            for (let i = 0; i < 1000; i++) {
                let id15to17 = String(i).padStart(3, '0');
                let id17thDigit = parseInt(id15to17[2]);
                if ((gender === 'male' && id17thDigit % 2 === 1) || (gender === 'female' && id17thDigit % 2 === 0)) {
                    let id17 = idPrefix + id15to17;
                    let checkCode = calculateCheckCode(id17);
                    let fullID = id17 + checkCode;
                    possibleIDs.push(fullID);
                }
            }
            resultTextarea.value = possibleIDs.join('\n');
        }        
        function copyToClipboard() {
            const resultTextarea = document.getElementById('result');
            resultTextarea.select();
            document.execCommand('copy');        
        }
   </script>
